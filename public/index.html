<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlaVia 文字地圖</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js" crossorigin="anonymous" data-clerk-publishable-key="pk_test_cG9zc2libGUtc2tpbmstNC5jbGVyay5hY2NvdW50cy5kZXYk"></script>    <!-- Google Maps JS API for Street View Links -->
    <script id="google-maps-api" type="text/javascript" async defer></script>  </head>
  <body>
    <div id="srAnnouncements" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="auth-bar" style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:8px 16px;background:#f5f5f5;border-bottom:1px solid #ddd;min-height:38px;" aria-label="認證狀態"></div>
    <div id="my-billing" style="display:none;padding:8px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:0.9rem;color:#1f2937;" aria-live="polite"></div>
    <div id="pending-msg" style="display:none;padding:32px;text-align:center;font-size:1.1rem;color:#555;" role="status" aria-live="polite"></div>
    <div id="main-content">
      <main class="container">
        <header class="topbar">
          <div>
            <h1 id="titleText">AlaVia 文字地圖導覽</h1>
            <p id="leadText" class="lead">
              使用方式：輸入地址或道路名稱後，系統由後端自動定位與框選範圍並搜尋路口。
            </p>
          </div>
          <label id="uiLangLabel" class="lang-picker">介面語言
            <select id="uiLang">
              <option value="zh-Hant" selected>繁體中文 (Traditional Chinese)</option>
              <option value="en">English</option>
              <option value="ja">日本語 (Japanese)</option>
              <option value="ko">한국어 (Korean)</option>
            </select>
          </label>
        </header>

        <section class="panel">
          <h2 id="querySectionTitle">查詢路段</h2>
          <label id="countryLabel">國家偏好（English 中文）
            <select id="countryCode">
              <option value="TW" selected>Taiwan 台灣</option>
              <option value="HK">Hong Kong 香港</option>
              <option value="JP">Japan 日本</option>
              <option value="US">United States 美國</option>
              <option value="GB">United Kingdom 英國</option>
              <option value="CA">Canada 加拿大</option>
              <option value="AU">Australia 澳洲</option>
              <option value="SG">Singapore 新加坡</option>
              <option value="MY">Malaysia 馬來西亞</option>
            </select>
          </label>
          <label id="roadNameLabel" for="roadName">路段名稱</label>
          <span id="roadNameHint" class="minor">請輸入完整地址或道路名稱，建議包含城市/地區以提高命中率，例如：香港南昌街、台北市大安區忠孝東路四段。</span>
          <input id="roadName" type="text" placeholder="請輸入地址或道路名稱" aria-labelledby="roadNameLabel" aria-describedby="roadNameHint" autocomplete="street-address" />
          <label id="sampleIntervalLabel">街景描述沿路採樣間距（公尺）
            <input id="sampleInterval" type="number" min="10" value="10" />
          </label>
          <div class="actions-row">
            <button id="loadRoadBtn">搜尋路口</button>
            <button id="useGpsBtn" type="button">用目前位置</button>
          </div>
          <h2 id="quickNavTitle">快速街道導覽</h2>
          <p id="quickNavHint" class="sr-only">打開讀屏焦點模式後可直接用上下左右方向鍵進行操作。</p>
          <section id="quickNav" class="quick-nav" role="application" aria-labelledby="quickNavTitle" aria-describedby="quickNavHint">
            <div class="quick-nav-actions">
              <button id="navForwardBtn">往前</button>
              <button id="navBackBtn">往後</button>
              <button id="navLeftBtn">往左</button>
              <button id="navRightBtn">往右</button>
            </div>
            <div class="quick-nav-actions quick-nav-street-actions">
              <button id="quickStreetBtn" class="paid">街景詳細描述（$0.015）</button>
              <button id="quickStreetAdvanceBtn" disabled>往前 10 公尺街景詳細描述</button>
              <button id="quickIndoorBtn" class="paid">室內導覽</button>
            </div>
            <div id="quickNavStatus" class="result"></div>
            <div id="quickNavOsm" class="result"></div>
            <div id="quickNavStreet" class="result"></div>
            <div id="quickNavIndoor" class="result"></div>
          </section>
          <div class="result" id="roadSummary"></div>
        </section>

        <section class="panel">
          <h2 id="intersectionSectionTitle">路口清單</h2>
          <div class="costs" id="costs"></div>
          <div id="intersections" class="intersection-list"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js?v=20260520d"></script>
  </body>
</html>
