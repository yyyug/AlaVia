<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlaVia 文字地圖</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>AlaVia 文字地圖導覽</h1>
      <p class="lead">
        使用方式：先在路段名稱輸入地址或道路名稱（例如：香港南昌街、台北市忠孝東路四段），系統會先自動定位並設定 bbox，搜尋前再自動放大 2 倍以提高長路段命中率；若結果不理想可手動調整 bbox 後再搜尋。
      </p>

      <section class="panel">
        <h2>查詢路段</h2>
        <label>國家偏好（English 中文）
          <select id="countryCode">
            <option value="TW" selected>Taiwan 台灣</option>
            <option value="HK">Hong Kong 香港</option>
            <option value="JP">Japan 日本</option>
            <option value="US">United States 美國</option>
            <option value="GB">United Kingdom 英國</option>
            <option value="CA">Canada 加拿大</option>
            <option value="AU">Australia 澳洲</option>
            <option value="SG">Singapore 新加坡</option>
            <option value="MY">Malaysia 馬來西亞</option>
          </select>
        </label>
        <label id="roadNameLabel" for="roadName">路段名稱</label>
        <span id="roadNameHint" class="minor">請輸入完整地址或道路名稱，建議包含城市/地區以提高命中率，例如：香港南昌街、台北市大安區忠孝東路四段。</span>
        <input id="roadName" type="text" placeholder="請輸入地址或道路名稱" aria-labelledby="roadNameLabel" aria-describedby="roadNameHint" autocomplete="street-address" />
        <div class="bbox-grid">
          <label>South
            <input id="bboxSouth" type="number" step="0.000001" value="25.025000" />
          </label>
          <label>West
            <input id="bboxWest" type="number" step="0.000001" value="121.525000" />
          </label>
          <label>North
            <input id="bboxNorth" type="number" step="0.000001" value="25.060000" />
          </label>
          <label>East
            <input id="bboxEast" type="number" step="0.000001" value="121.565000" />
          </label>
        </div>
        <label>沿路採樣間距（公尺）
          <input id="sampleInterval" type="number" min="10" value="50" />
        </label>
        <div class="actions-row">
          <button id="loadRoadBtn">搜尋路口</button>
          <button id="estimateBtn">更新預估</button>
        </div>
        <div class="result" id="roadSummary"></div>
      </section>

      <section class="panel">
        <h2>路口清單</h2>
        <div class="costs" id="costs"></div>
        <div id="intersections" class="intersection-list"></div>
      </section>

      <section class="panel">
        <h2>朗讀面板</h2>
        <label>語音語言
          <select id="ttsLang">
            <option value="zh-TW" selected>繁體中文（台灣）</option>
            <option value="zh-HK">繁體中文（香港）</option>
            <option value="zh-CN">簡體中文</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="ja-JP">日本語</option>
          </select>
        </label>
        <button id="readBtn">朗讀目前焦點路口</button>
        <button id="stopBtn">停止朗讀</button>
        <div id="readingText" aria-live="polite" class="reading"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
