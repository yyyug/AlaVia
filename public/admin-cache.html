<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlaVia 街道路段快取索引</title>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js" crossorigin="anonymous" data-clerk-publishable-key="pk_test_cG9zc2libGUtc2tpbmstNC5jbGVyay5hY2NvdW50cy5kZXYk"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 1.3rem; margin-bottom: 6px; }
      .hint { color: #555; margin-bottom: 14px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
      th { background: #f5f5f5; font-weight: 600; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      #status { margin: 10px 0; color: #555; }
      .ok { color: #166534; }
      .warn { color: #92400e; }
      .bad { color: #991b1b; }
    </style>
  </head>
  <body>
    <h1>街道路段快取索引 Street Cache Index</h1>
    <div class="hint">顯示目前已快取的道路名稱、國家/地區與剩餘過期時間。</div>

    <div class="toolbar">
      <a href="/admin.html" style="display:inline-flex;align-items:center;padding:6px 12px;border:1px solid #ccc;border-radius:4px;text-decoration:none;color:#111;background:#fff;">返回管理後台 Back</a>
      <button id="sign-in-btn" style="padding:6px 12px;cursor:pointer;">登入 Sign In</button>
      <button id="sign-out-btn" style="display:none;padding:6px 12px;cursor:pointer;">登出 Sign Out</button>
      <button id="refresh-btn" style="padding:6px 12px;cursor:pointer;">重新整理 Refresh</button>
    </div>

    <div id="status">載入中...</div>
    <table id="street-table" style="display:none;">
      <thead>
        <tr>
          <th>街名 Road</th>
          <th>國家/地區 Country/Region</th>
          <th>合併筆數 Merged</th>
          <th>距離過期 Expires In</th>
          <th>到期時間 Expires At</th>
          <th>狀態 Status</th>
        </tr>
      </thead>
      <tbody id="street-tbody"></tbody>
    </table>

    <script type="module" src="/admin-cache.js"></script>
  </body>
</html>
